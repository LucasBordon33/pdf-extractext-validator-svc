services:
  validator:
    build:
      context: .
    image: pdf-validator-service:0.1.0
    env_file:
      - .env
    expose:
      - "8001"
    read_only: true
    tmpfs:
      - /tmp:size=10m
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - pdf-extractext-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.validator.rule=Host(`universidad.localhost`) && PathPrefix(`/validate`)"
      - "traefik.http.routers.validator.entrypoints=websecure"
      - "traefik.http.routers.validator.tls=true"
      - "traefik.http.routers.validator.priority=100"
      - "traefik.http.services.validator.loadbalancer.server.port=8001"
      - "traefik.http.routers.validator.middlewares=validator-retry@docker, validator-cb@docker"
      - "traefik.http.middlewares.validator-retry.retry.attempts=3"
      - "traefik.http.middlewares.validator-retry.retry.initialinterval=100ms"
      - "traefik.http.middlewares.validator-cb.circuitbreaker.expression=NetworkErrorRatio() > 0.2 || ResponseCodeRatio(500, 600, 0, 600) > 0.2"
      - "traefik.http.middlewares.validator-cb.circuitbreaker.checkperiod=10s"
      - "traefik.http.middlewares.validator-cb.circuitbreaker.fallbackduration=15s"

networks:
  pdf-extractext-network:
    external: true