[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-validator-service"
version = "0.1.0"
description = "Microservicio stateless para validar integridad de PDFs en memoria."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-magic-bin; sys_platform == 'win32'",
    "python-magic; sys_platform != 'win32'",
    "pypdf>=5.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "coverage>=7.0",
    "ruff>=0.5",
]
# Solo sistemas Windows (libmagic embebido para python-magic)
windows = [
    "python-magic-bin>=0.4.14",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "README.md", "ISSUES.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"