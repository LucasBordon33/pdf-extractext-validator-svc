rules:
  - id: pdf-validator-no-disk-write
    languages: [python]
    severity: ERROR
    message: "Escritura a disco prohibida. Este microservicio debe procesar todo en memoria con BytesIO."
    paths:
      include:
        - app/
      exclude:
        - tests/
    patterns:
      - pattern-either:
          # Semgrep normaliza comillas, por lo que buscar "w" atrapa también 'w'
          - pattern: open(..., "w", ...)
          - pattern: open(..., "a", ...)
          - pattern: open(..., "wb", ...)
          - pattern: open(..., "ab", ...)
          - pattern: open(..., "x", ...)
          - pattern: open(..., "xb", ...)
          - pattern: $P.write_text(...)
          - pattern: $P.write_bytes(...)
          - pattern: pathlib.Path(...).write_text(...)
          - pattern: pathlib.Path(...).write_bytes(...)
          - pattern: shutil.copy(...)
          - pattern: shutil.copy2(...)
          - pattern: shutil.move(...)
          - pattern: tempfile.NamedTemporaryFile(..., delete=False, ...)
          - pattern: tempfile.mkstemp(...)

  - id: pdf-validator-base64-must-validate
    languages: [python]
    severity: WARNING
    message: "Usar base64.b64decode con validate=True para rechazar cadenas base64 malformadas."
    paths:
      include:
        - app/
    patterns:
      - pattern: base64.b64decode(...)
      - pattern-not: base64.b64decode(..., validate=True, ...)

  - id: pdf-validator-no-shell-exec
    languages: [python]
    severity: ERROR
    message: "Prohibido usar subprocess con shell=True, os.system u os.popen."
    paths:
      include:
        - app/
      exclude:
        - tests/
    patterns:
      - pattern-either:
          - pattern: subprocess.$FUNC(..., shell=True, ...)
          - pattern: os.system(...)
          - pattern: os.popen(...)

  - id: pdf-validator-no-eval-exec
    languages: [python]
    severity: ERROR
    message: "Prohibido usar eval o exec."
    paths:
      include:
        - app/
      exclude:
        - tests/
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  - id: pdf-validator-magic-from-bytes-only
    languages: [python]
    severity: WARNING
    message: "Usar magic.from_buffer sobre bytes. Evitar magic.from_file() en este servicio in-memory."
    paths:
      include:
        - app/
    pattern: magic.from_file(...)